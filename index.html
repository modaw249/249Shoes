<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>249Shoes | خطوتك الجاية مختلفة</title>
<meta name="description" content="249Shoes — أحذية رياضية بروح سودانية عصرية. اختر حذاءك ومقاسك واطلب مباشرة عبر واتساب.">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ink:#151515;--sand:#f5f3ee;--orange:#f27745;--green:#168348;--mut:#71717a;--line:#d4d4d8}
*{box-sizing:border-box;margin:0}body{font-family:Cairo,sans-serif;background:var(--sand);color:var(--ink);line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}a{color:inherit;text-decoration:none}:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.disp{font-family:'Space Grotesk',Cairo,sans-serif}#announce{background:var(--orange);text-align:center;padding:8px 16px;font-weight:700;font-size:13px}
header{background:var(--ink);color:#fff}.bar{max-width:1200px;margin:auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{width:76px;height:76px;object-fit:contain;border-radius:18px;flex:0 0 auto}
.logo{font-size:26px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
.hbtns{display:flex;gap:10px;align-items:center}
@media(max-width:640px){.bar{padding:12px 16px}.brand{gap:10px}.brand img{width:76px;height:76px;border-radius:17px}.logo{font-size:24px}.cartbtn{padding:7px 10px;font-size:13px}}.cartbtn{position:relative;padding:8px 14px;border:1px solid #52525b;border-radius:10px;font-size:14px}
.cartbtn b{background:var(--orange);color:var(--ink);border-radius:99px;padding:0 7px;margin-inline-start:6px;font-size:12px}.wa{background:var(--green);color:#fff;border-radius:10px;padding:8px 16px;font-weight:700;font-size:14px}
.wa:hover{background:#106337}main{max-width:1200px;margin:auto;padding:28px 20px}.search{width:100%;max-width:360px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:22px;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:30px 22px}.card .img{display:block;position:relative;width:100%;aspect-ratio:1.27;background:#e8e6e1;border-radius:16px;overflow:hidden}
.card img{width:100%;height:100%;object-fit:cover}.badge{position:absolute;top:12px;right:12px;background:var(--sand);border-radius:99px;padding:3px 12px;font-size:11px;font-weight:700}
.cat{font-size:11px;color:var(--mut);margin-top:12px}.card h3{font-size:20px;font-weight:800;margin-top:2px}.card p.d{font-size:13px;color:var(--mut);margin-top:4px}
.price{display:flex;gap:10px;align-items:baseline;margin-top:8px}.price strong{font-size:18px}.price del{font-size:12px;color:var(--mut)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding-top:10px;border-top:1px solid rgba(242,119,69,.7);font-size:12px;color:var(--mut)}
.plus{width:44px;height:44px;border-radius:12px;background:var(--orange);font-size:22px;font-weight:700}.plus:hover{background:var(--ink);color:var(--orange)}
.cta{background:var(--orange)}.cta div{max-width:1200px;margin:auto;padding:30px 20px;display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:center}
.cta h2{font-size:24px;font-weight:800}.cta a{background:var(--ink);color:#fff;border-radius:10px;padding:12px 26px;font-weight:700}
footer{background:var(--ink);color:#d4d4d8;font-size:12px}footer .bar{flex-wrap:wrap;padding:24px 20px}footer button:hover{color:var(--orange)}
.flag{display:flex;gap:3px}.flag i{width:20px;height:4px}.wafab{position:fixed;bottom:20px;left:20px;width:56px;height:56px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 8px 20px rgba(0,0,0,.25);z-index:30}
dialog{border:0;border-radius:16px;background:var(--sand);color:var(--ink);padding:0;width:92vw;max-width:760px;max-height:90vh;overflow:auto}dialog::backdrop{background:rgba(0,0,0,.7)}
.x{position:absolute;top:10px;left:10px;width:38px;height:38px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);z-index:2}
.dgrid{display:grid;grid-template-columns:1fr 1fr}.dgrid img{width:100%;height:100%;min-height:260px;object-fit:cover}.dbody{padding:28px}
.sizes{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.sz{width:44px;height:44px;border:1px solid var(--line);border-radius:8px}.sz[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{display:block;width:100%;border-radius:10px;padding:12px;font-weight:700;font-size:14px;margin-top:10px;text-align:center}.b1{background:var(--green);color:#fff}.b2{border:1px solid var(--ink)}.b2:hover{background:var(--ink);color:#fff}
.err{color:#b91c1c;font-size:12px;min-height:18px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
input,textarea,select{font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}label{display:block;font-size:12px;font-weight:700;margin-top:12px}
.pad{padding:24px}table{width:100%;text-align:center;font-size:14px;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #e4e4e7}th{background:var(--ink);color:#fff}
.mini{font-size:12px;border:1px solid var(--line);border-radius:8px;padding:4px 10px}.pe{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}#toast{position:fixed;bottom:24px;right:20px;background:var(--ink);color:#fff;border-radius:12px;padding:12px 20px;font-size:14px;z-index:100;display:none;max-width:90vw}
@media(max-width:640px){.dgrid{grid-template-columns:1fr}.dgrid img{height:240px;min-height:0}.wa.hd{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
</style>
</head>
